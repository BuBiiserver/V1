<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiteHub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f6f7f9;--cd:#fff;--tx:#14171f;--mu:#667085;--bd:#e3e6ec;--ac:#4f46e5;--ok:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1117;--cd:#161b22;--tx:#e6e9ef;--mu:#8b93a3;--bd:#2a313c;--ac:#818cf8;--ok:#4ade80}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--tx)}
button,input{font:inherit;color:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.r{background:#dc2626}
input{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
.top{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--cd);border-bottom:1px solid var(--bd)}.top b{font-size:17px}.sp{flex:1}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px}
.login{max-width:380px;margin:12vh auto;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:26px}.login input{width:100%;margin:12px 0}
.drop{border:2px dashed var(--bd);border-radius:14px;padding:28px;text-align:center;color:var(--mu);margin-bottom:20px}.drop.on{border-color:var(--ac);color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px}.card h3{margin:0 0 4px}.card small{color:var(--mu)}.card .row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ed{display:grid;grid-template-columns:200px 1fr 1fr;height:calc(100vh - 100px)}
@media(max-width:800px){.ed{grid-template-columns:1fr;grid-template-rows:140px 1fr 1fr}}
.tree{overflow:auto;border-right:1px solid var(--bd);background:var(--cd);padding:6px}
.tree div{padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;word-break:break-all}.tree div:hover{background:var(--bg)}.tree div.on{background:var(--ac);color:#fff}
textarea{width:100%;height:100%;border:0;resize:none;padding:12px;background:var(--bg);color:var(--tx);font:13px/1.55 ui-monospace,Menlo,monospace;tab-size:2;outline:0}
iframe{width:100%;height:100%;border:0;background:#fff;border-left:1px solid var(--bd)}
.bar{display:flex;gap:8px;align-items:center;padding:8px 16px;background:var(--cd);border-bottom:1px solid var(--bd);flex-wrap:wrap}.bar input{flex:1;min-width:180px;font-size:13px}
.st{font-size:13px;color:var(--mu)}.st.ok{color:var(--ok)}.msg{color:var(--mu);font-size:14px}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(u,m='GET',b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return r.json()};
const TXT=/\.(html?|css|js|mjs|json|txt|md|svg|xml|csv)$/i;let site,files,cur,timer;

async function init(){const {me}=await api('/api/me');me?dash(me):login()}
function login(){A.innerHTML=`<div class="login"><h2 style="margin:0">🌐 SiteHub</h2><p class="msg">ใส่อีเมลเพื่อรับลิงก์เข้าสู่ระบบ ไม่ต้องใช้รหัสผ่าน</p><input id="em" type="email" placeholder="you@example.com"><button class="btn" style="width:100%" id="go">ส่งลิงก์เข้าสู่ระบบ</button><p id="m" class="msg"></p></div>`;
 $('#go').onclick=async()=>{const r=await api('/api/login','POST',{email:$('#em').value});
  $('#m').innerHTML=r.error?esc(r.error):r.sent?'ส่งลิงก์ไปที่อีเมลแล้ว ตรวจสอบกล่องจดหมายของคุณ':`โหมดทดสอบ (ยังไม่ตั้ง SMTP): <a href="${esc(r.dev)}">กดที่นี่เพื่อเข้าสู่ระบบ</a>`}}

async function dash(me){
 const sites=await api('/api/sites');
 A.innerHTML=`<div class="top"><b>🌐 SiteHub</b><span class="sp"></span><span class="msg">${esc(me.email)}</span><button class="btn g" id="lo">ออกจากระบบ</button></div>
 <div class="wrap"><div class="drop" id="dz"><p>ลากไฟล์ <b>.zip</b> ของเว็บมาวางที่นี่ หรือ</p><input type="file" id="fi" accept=".zip"> <button class="btn g" id="nw">+ สร้างเว็บเปล่า</button><p class="msg" id="um"></p></div>
 <h3>เว็บของฉัน (${sites.length})</h3><div class="grid">${sites.map(s=>`<div class="card"><h3>${esc(s.name)}</h3><small>v${s.version} · ${new Date(s.updated).toLocaleString('th-TH')}</small><div class="row"><button class="btn" data-e="${s.id}">แก้โค้ด</button><a class="btn g" style="text-decoration:none" target="_blank" href="${s.link}">เปิดเว็บ</a><button class="btn g" data-c="${s.link}">คัดลอกลิงก์</button><button class="btn g" data-r="${s.id}">ชื่อ</button><button class="btn r" data-d="${s.id}">ลบ</button></div></div>`).join('')||'<p class="msg">ยังไม่มีเว็บ ลองอัปโหลด zip ดูครับ</p>'}</div></div>`;
 $('#lo').onclick=async()=>{await api('/api/logout','POST');login()};
 $('#nw').onclick=async()=>{const n=prompt('ชื่อเว็บ','เว็บใหม่');if(n){const s=await api('/api/sites','POST',{name:n});edit(s.id)}};
 const up=async f=>{if(!f)return;$('#um').textContent='กำลังดึงโค้ดจากไฟล์…';
  const z=await JSZip.loadAsync(f),out=[];
  for(const e of Object.values(z.files)){if(e.dir||/(^|\/)(__MACOSX|\.DS_Store)/.test(e.name))continue;const t=TXT.test(e.name);out.push({path:e.name,content:await e.async(t?'string':'base64'),b64:!t})}
  const top=new Set(out.map(o=>o.path.split('/')[0]));
  if(top.size===1&&!out.some(o=>o.path==='index.html')&&out.every(o=>o.path.includes('/')))out.forEach(o=>o.path=o.path.slice(o.path.indexOf('/')+1));
  const s=await api('/api/sites','POST',{name:f.name.replace(/\.zip$/i,''),files:out});edit(s.id)};
 $('#fi').onchange=e=>up(e.target.files[0]);
 const dz=$('#dz');dz.ondragover=e=>{e.preventDefault();dz.classList.add('on')};dz.ondragleave=()=>dz.classList.remove('on');dz.ondrop=e=>{e.preventDefault();up(e.dataTransfer.files[0])};
 A.onclick=async e=>{const t=e.target,d=t.dataset;
  if(d.e)edit(d.e);if(d.c){navigator.clipboard.writeText(d.c);t.textContent='คัดลอกแล้ว ✓'}
  if(d.r){const n=prompt('ชื่อใหม่');if(n){await api('/api/sites/'+d.r,'PATCH',{name:n});dash(me)}}
  if(d.d&&confirm('ลบเว็บนี้ถาวร?')){await api('/api/sites/'+d.d,'DELETE');dash(me)}}}

async function edit(id){
 const r=await api('/api/sites/'+id);site=r.site;files=r.files;cur=null;
 A.onclick=null;
 A.innerHTML=`<div class="top"><button class="btn g" id="bk">← กลับ</button><b>${esc(site.name)}</b><span class="sp"></span><span class="st" id="st">v${site.version}</span></div>
 <div class="bar"><span class="msg">ลิงก์ของคุณ:</span><input id="lk" readonly value="${site.link}"><button class="btn g" id="cp">คัดลอก</button><a class="btn" style="text-decoration:none" target="_blank" id="op" href="${site.link}">เปิดเว็บ</a><button class="btn g" id="nf">+ ไฟล์</button><button class="btn g" id="zp">⬇ ดาวน์โหลด zip</button></div>
 <div class="ed"><div class="tree" id="tr"></div><textarea id="ta" spellcheck="false" placeholder="เลือกไฟล์ทางซ้ายเพื่อแก้โค้ด"></textarea><iframe id="pv" src="${site.link}"></iframe></div>`;
 $('#bk').onclick=()=>init();$('#cp').onclick=()=>{navigator.clipboard.writeText($('#lk').value);$('#cp').textContent='คัดลอกแล้ว ✓'};
 $('#nf').onclick=async()=>{const n=prompt('ชื่อไฟล์ เช่น about.html หรือ css/style.css');if(n){await save(n,'');if(!files.includes(n))files.push(n);open(n)}};
 $('#zp').onclick=dl;
 const ta=$('#ta');ta.oninput=()=>{if(!cur)return;setSt('กำลังบันทึก…');clearTimeout(timer);timer=setTimeout(()=>save(cur,ta.value),700)};
 ta.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart;ta.setRangeText('  ',s,ta.selectionEnd,'end');ta.oninput()}if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();clearTimeout(timer);save(cur,ta.value)}};
 tree();const f=files.includes('index.html')?'index.html':files.find(x=>TXT.test(x));f&&open(f)}
function tree(){$('#tr').innerHTML=files.map(f=>`<div class="${f===cur?'on':''}" data-f="${esc(f)}"><span>${esc(f)}</span><span data-x="${esc(f)}">✕</span></div>`).join('');
 $('#tr').onclick=async e=>{const x=e.target.dataset.x,f=e.target.closest('[data-f]')?.dataset.f;
  if(x){if(confirm('ลบ '+x+'?')){await api(`/api/sites/${site.id}/file?path=${encodeURIComponent(x)}`,'DELETE');files=files.filter(y=>y!==x);if(cur===x){cur=null;$('#ta').value=''}tree();reload()}}else if(f)open(f)}}
async function open(f){cur=f;tree();const ta=$('#ta'),r=await api(`/api/sites/${site.id}/file?path=${encodeURIComponent(f)}`);
 if(r.binary){ta.value='(ไฟล์ไบนารี แก้ไขไม่ได้)';ta.disabled=true}else{ta.disabled=false;ta.value=r.content||''}}
async function save(p,c){const r=await api(`/api/sites/${site.id}/file`,'PUT',{path:p,content:c});if(r.error)return setSt(r.error);
 site.version=r.version;$('#lk').value=r.link;$('#op').href=r.link;setSt(`บันทึกแล้ว ✓ v${r.version}`,1);reload()}
const reload=()=>{const v=$('#pv');if(v)v.src=site.link+'?v='+site.version};
const setSt=(t,ok)=>{const s=$('#st');s.textContent=t;s.className='st'+(ok?' ok':'')};
async function dl(){const z=new JSZip();for(const f of files){const r=await api(`/api/sites/${site.id}/file?path=${encodeURIComponent(f)}`);if(!r.binary)z.file(f,r.content)}
 const a=document.createElement('a');a.href=URL.createObjectURL(await z.generateAsync({type:'blob'}));a.download=site.name+'.zip';a.click()}
init();
</script></body></html>
